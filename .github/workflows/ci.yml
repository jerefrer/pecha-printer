name: CI

# Ruby comes from the 3.3 series rather than .ruby-version: GitHub's runners
# only provide the latest patch of each series, while the server stays on the
# exact version in .ruby-version. The test job needs the PDF
# tools the app shells out to.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    # Same Ubuntu as the production server, so pdfjam and podofocrop behave the same.
    runs-on: ubuntu-22.04
    env:
      CI: true
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y texlive-extra-utils texlive-latex-recommended poppler-utils libpodofo-utils ghostscript sqlite3 libsqlite3-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true

      - name: Run tests
        run: bin/rails db:test:prepare test
